<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LinkVault – Quản lý liên kết</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== CSS VARIABLES – THEMES ===== */
:root {
  --bg: #0d0d12;
  --bg2: #13131a;
  --bg3: #1a1a24;
  --surface: #1e1e2e;
  --surface2: #252538;
  --border: #2e2e44;
  --text: #e2e2f0;
  --text2: #9898b8;
  --text3: #5a5a78;
  --accent: #7c6af7;
  --accent2: #a78bfa;
  --accent-glow: rgba(124,106,247,0.25);
  --danger: #f43f5e;
  --danger2: #fb7185;
  --success: #10b981;
  --radius: 12px;
  --radius-sm: 7px;
  --shadow: 0 4px 24px rgba(0,0,0,0.45);
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.35);
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  --font-head: 'Syne', sans-serif;
  --font-mono: 'Space Mono', monospace;
}


/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-head);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
  overflow-x: hidden;
}
/* Background texture */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 20% 0%, var(--accent-glow) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(124,106,247,0.08) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

/* ===== LAYOUT ===== */
.app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }

/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  gap: 12px;
  flex-wrap: wrap;
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 9px;
  display: grid;
  place-items: center;
  box-shadow: 0 0 16px var(--accent-glow);
}
.logo-icon svg { width: 20px; height: 20px; fill: white; }
.logo-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: relative; }

/* Menu Dropdown */
.menu-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  min-width: 200px;
  display: none;
  flex-direction: column;
  z-index: 1000;
  overflow: hidden;
}
.menu-dropdown.show { display: flex; }
.menu-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
  color: var(--text2);
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover {
  background: var(--surface2);
  color: var(--text);
}
.menu-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* Sample Data Dropdown (submenu) */
.sample-data-dropdown {
  display: none;
  flex-direction: column;
  max-height: 220px;
  overflow-y: auto;
  background: var(--surface2);
}
.sample-data-dropdown.show { display: flex; }
.sample-data-dropdown-item {
  padding: 10px 14px;
  padding-left: 34px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
  color: var(--text2);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}
.sample-data-dropdown-item:last-child { border-bottom: none; }
.sample-data-dropdown-item:hover {
  background: var(--surface);
  color: var(--text);
}
.sample-data-dropdown-item.loading {
  color: var(--text3);
  pointer-events: none;
}
.sample-data-dropdown-empty {
  padding: 20px 14px;
  text-align: center;
  color: var(--text3);
  font-size: 13px;
}

/* ===== BUTTONS ===== */
.btn {
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all var(--transition);
  white-space: nowrap;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.96); }
.btn-primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 2px 12px var(--accent-glow);
}
.btn-primary:hover { filter: brightness(1.1); box-shadow: 0 4px 18px var(--accent-glow); }
.btn-ghost {
  background: var(--surface);
  color: var(--text2);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-danger {
  background: transparent;
  color: var(--danger2);
  border: 1px solid var(--danger);
}
.btn-danger:hover { background: rgba(244,63,94,0.12); }
.btn-icon {
  width: 30px; height: 30px;
  padding: 0;
  border-radius: 6px;
  font-size: 14px;
  justify-content: center;
}

/* ===== GROUPS CONTAINER ===== */
#groups-container { display: flex; flex-direction: column; gap: 16px; }

/* ===== GROUP CARD ===== */
.group-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition);
}
.group-card.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
.group-card.dragging { opacity: 0.4; transform: scale(0.98); }

.group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--transition);
}
.group-header:hover { background: var(--surface2); }

.group-color-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 8px currentColor;
}
.group-name {
  flex: 1;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.3px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.group-count {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text3);
  background: var(--bg3);
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid var(--border);
}
.group-chevron {
  width: 18px; height: 18px;
  color: var(--text3);
  transition: transform var(--transition);
  flex-shrink: 0;
}
.group-card.collapsed .group-chevron { transform: rotate(-90deg); }
.group-header-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity var(--transition);
}
.group-header:hover .group-header-actions,
.group-card:focus-within .group-header-actions { opacity: 1; }
@media (hover: none) { .group-header-actions { opacity: 1; } }

.group-add-btn {
  width: 26px; height: 26px;
  background: var(--accent);
  border: none;
  border-radius: 6px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all var(--transition);
  flex-shrink: 0;
  box-shadow: 0 2px 8px var(--accent-glow);
  -webkit-tap-highlight-color: transparent;
}
.group-add-btn:hover { filter: brightness(1.15); transform: scale(1.05); }
.group-add-btn:active { transform: scale(0.92); }

/* ===== LINKS GRID ===== */
.group-body {
  padding: 0 14px 14px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  transition: all 0.3s ease;
}
.group-card.collapsed .group-body { display: none; }
.group-empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 20px;
  color: var(--text3);
  font-size: 13px;
  font-family: var(--font-mono);
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
}

/* ===== LINK CARD ===== */
.link-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
  transition: all var(--transition);
  position: relative;
  cursor: grab;
  min-height: 90px;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}
.link-card:active { cursor: grabbing; }
.link-card:hover { background: var(--surface2); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.link-card.drag-over-link { border-color: var(--accent2); background: var(--surface2); }
.link-card.dragging-link { opacity: 0.3; }

.link-img-wrap {
  width: 40px; height: 40px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface2);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.link-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.link-favicon {
  width: 24px; height: 24px;
  font-size: 22px;
  display: grid;
  place-items: center;
}
.link-name {
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  line-height: 1.3;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  word-break: break-word;
  width: 100%;
}
.link-url {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  width: 100%;
  text-align: center;
}

/* Edit mode – nút sửa/xóa hiện góc dưới, KHÔNG che nội dung */
.link-actions {
  position: absolute;
  bottom: 4px;
  right: 4px;
  display: none;
  gap: 4px;
  z-index: 2;
}
body.edit-mode .link-actions { display: flex; }
/* Viền accent nhẹ để nhận biết card đang ở edit mode */
body.edit-mode .link-card {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-glow);
  padding-bottom: 36px;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow);
  animation: modalIn 0.22s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 20px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-title span { color: var(--accent2); }

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text2);
  margin-bottom: 6px;
  font-family: var(--font-mono);
}
.field input, .field select {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: var(--font-head);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.field input:focus, .field select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.field input::placeholder { color: var(--text3); }
.field-row { display: flex; gap: 8px; align-items: flex-end; }
.field-row .field { flex: 1; margin-bottom: 0; }

.fetch-btn {
  height: 36px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--accent2);
  font-size: 12px;
  font-family: var(--font-head);
  font-weight: 600;
  padding: 0 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
}
.fetch-btn:hover { background: var(--accent); color: white; }

.color-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 6px;
}
.color-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all var(--transition);
  position: relative;
}
.color-dot:hover { transform: scale(1.15); }
.color-dot.selected { border-color: var(--text); transform: scale(1.1); }
.color-dot.selected::after {
  content: '✓';
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }



/* Edit mode indicator */
.edit-badge {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: white;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-mono);
  padding: 8px 18px;
  border-radius: 30px;
  box-shadow: 0 4px 20px var(--accent-glow);
  z-index: 800;
  display: none;
  white-space: nowrap;
  letter-spacing: 0.5px;
  animation: badgePop 0.3s ease;
}
@keyframes badgePop {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
body.edit-mode .edit-badge { display: block; }

/* Drag handle in edit mode */
body.edit-mode .group-header { cursor: grab; }
body.edit-mode .group-header:active { cursor: grabbing; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 30px;
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== IMAGE PREVIEW ===== */
.img-preview {
  width: 100%;
  height: 60px;
  background: var(--bg3);
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  display: none;
  align-items: center;
  justify-content: center;
  margin-top: 6px;
  overflow: hidden;
}
.img-preview.has-img { display: flex; }
.img-preview img { max-height: 100%; max-width: 100%; object-fit: contain; }

/* ===== LOADING ===== */
.loading-dots {
  display: inline-flex;
  gap: 3px;
  align-items: center;
}
.loading-dots span {
  width: 5px; height: 5px;
  background: var(--accent2);
  border-radius: 50%;
  animation: dots 1.2s ease infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dots {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

/* ===== ADD GROUP AREA ===== */
.add-group-area {
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 18px;
  text-align: center;
  cursor: pointer;
  color: var(--text3);
  font-size: 13px;
  font-weight: 600;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.add-group-area:hover { border-color: var(--accent); color: var(--accent2); background: var(--accent-glow); }

/* Responsive */
@media (max-width: 480px) {
  .app { padding: 16px 12px 80px; }
  .group-body { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .header-actions .btn span { display: none; }
  .logo-title { font-size: 18px; }
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="logo-title">LinkVault</div>
    </div>
    <div class="header-actions">
      <div style="position: relative;">
        <button class="btn btn-ghost btn-icon" id="btn-menu-toggle" title="Menu" onclick="document.getElementById('menu-dropdown').classList.toggle('show')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="menu-dropdown" id="menu-dropdown">
          <div class="menu-item" id="menu-export-json" onclick="document.getElementById('menu-dropdown').classList.remove('show'); document.getElementById('btn-export-json').click();">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Xuất JSON</span>
          </div>
          <div class="menu-item" id="menu-import-json" onclick="document.getElementById('menu-dropdown').classList.remove('show'); document.getElementById('import-file-input').click();">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Nhập JSON</span>
          </div>
          <div class="menu-item" id="menu-export-html" onclick="document.getElementById('menu-dropdown').classList.remove('show'); document.getElementById('btn-export-html').click();">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span>Xuất HTML</span>
          </div>
          <div class="menu-divider"></div>
          <div class="menu-item" id="menu-sample-data" onclick="event.stopPropagation(); document.getElementById('sample-data-dropdown-in-menu').classList.toggle('show'); if(document.getElementById('sample-data-dropdown-in-menu').innerHTML === '' && document.getElementById('sample-data-dropdown-in-menu').classList.contains('show')) { loadSampleDataListInMenu(); }">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Dữ liệu mẫu</span>
          </div>
          <div class="sample-data-dropdown" id="sample-data-dropdown-in-menu"></div>
        </div>
      </div>
      <!-- Hidden buttons for event handlers -->
      <button class="btn btn-ghost" id="btn-export-json" style="display:none;"></button>
      <button class="btn btn-ghost" id="btn-export-html" style="display:none;"></button>
      <input type="file" id="import-file-input" accept=".json" style="display:none">
      <button class="btn btn-ghost" id="btn-collapse-all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 14l8-8 8 8"/></svg>
        <span>Thu gọn</span>
      </button>
      <button class="btn btn-ghost" id="btn-edit-mode">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span>Sửa</span>
      </button>

  <div id="groups-container"></div>

  <div class="add-group-area" id="add-group-area" style="margin-top:16px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Thêm nhóm mới
  </div>
</div>

<!-- Edit badge -->
<div class="edit-badge">✏️ Chế độ Sửa – Kéo thả để sắp xếp</div>

<!-- Toast -->
<div class="toast" id="toast"></div>



<!-- ===== MODAL: Add/Edit Link ===== -->
<div class="modal-overlay" id="modal-link">
  <div class="modal">
    <div class="modal-title"><span>🔗</span> <span id="modal-link-title">Thêm liên kết</span></div>

        <label>Địa chỉ URL</label>

    </div>
    <div id="fetch-status" style="height:18px; margin-top:4px; font-size:11px; color:var(--text3); font-family:var(--font-mono);"></div>
    <div class="field">
      <label>Tên hiển thị</label>
      <input type="text" id="link-name" placeholder="Tên liên kết">
    </div>
    <div class="field">
      <label>Ảnh (URL hoặc đường dẫn)</label>
      <input type="text" id="link-img" placeholder="https://... hoặc img/icon.png">
      <div class="img-preview" id="img-preview-box"><img id="img-preview-img" src="" alt="preview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-link-cancel">Hủy</button>
      <button class="btn btn-primary" id="modal-link-save">Lưu</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: Add/Edit Group ===== -->
<div class="modal-overlay" id="modal-group">
  <div class="modal">
    <div class="modal-title"><span>📁</span> <span id="modal-group-title">Thêm nhóm</span></div>
    <div class="field">
      <label>Tên nhóm</label>
      <input type="text" id="group-name-input" placeholder="Tên nhóm...">
    </div>
    <div class="field">
      <label>Màu nhóm</label>
      <div class="color-grid" id="color-grid"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-group-cancel">Hủy</button>
      <button class="btn btn-primary" id="modal-group-save">Lưu</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: Confirm Delete ===== -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <div class="modal-title">⚠️ Xác nhận xóa</div>
    <p style="color:var(--text2); font-size:13px; margin-bottom:20px;" id="confirm-msg">Bạn có chắc muốn xóa không?</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="confirm-cancel">Hủy</button>
      <button class="btn btn-danger" id="confirm-ok">Xóa</button>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
const COLORS = [
  '#7c6af7','#00f5ff','#ff6b2b','#4ade80','#38bdf8','#e879f9',
  '#f59e0b','#f43f5e','#06b6d4','#a3e635','#fb923c','#818cf8'
];
let state = { groups: [], theme: '', collapsedGroups: {} };
let editMode = false;
let currentModalData = {};
let pendingDelete = null;
let dragSrcGroup = null, dragSrcLink = null;

// ===== STORAGE =====
function save() {
  try { localStorage.setItem('linkvault_data', JSON.stringify(state)); } catch(e) {}
}
function load() {
  try {
    const d = localStorage.getItem('linkvault_data');
    if (d) state = JSON.parse(d);
    if (!state.groups) state.groups = [];
    if (!state.collapsedGroups) state.collapsedGroups = {};
    if (!state.theme) state.theme = '';
  } catch(e) { state = { groups: [], theme: '', collapsedGroups: {} }; }
}

// ===== RENDER =====
function render() {
  const c = document.getElementById('groups-container');
  c.innerHTML = '';
  state.groups.forEach((g, gi) => {
    c.appendChild(renderGroup(g, gi));
  });
}

function renderGroup(g, gi) {
  const card = document.createElement('div');
  card.className = 'group-card' + (state.collapsedGroups[g.id] ? ' collapsed' : '');
  card.dataset.gid = g.id;
  card.draggable = editMode;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'group-header';
  hdr.innerHTML = `
    <div class="group-color-dot" style="background:${g.color||'#7c6af7'}; color:${g.color||'#7c6af7'}"></div>
    <div class="group-name">${esc(g.name)}</div>
    <div class="group-count">${g.links?.length||0}</div>
    <svg class="group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    <div class="group-header-actions" onclick="event.stopPropagation()">
      <button class="group-add-btn" title="Thêm link" onclick="openAddLink('${g.id}')">+</button>
      ${editMode ? `
      <button class="btn btn-ghost btn-icon" title="Sửa nhóm" onclick="openEditGroup('${g.id}')">✎</button>
      <button class="btn btn-icon" style="background:transparent;border:1px solid var(--danger);color:var(--danger2);" title="Xóa nhóm" onclick="deleteGroup('${g.id}')">✕</button>
      ` : ''}
    </div>
  `;
  hdr.addEventListener('click', (e) => {
    // Prevent toggle if we just finished a drag
    if (hdr._wasDragging) { hdr._wasDragging = false; return; }
    toggleGroup(g.id);
  });

  // Body
  const body = document.createElement('div');
  body.className = 'group-body';
  body.dataset.gid = g.id;

  if (!g.links || g.links.length === 0) {
    body.innerHTML = `<div class="group-empty">Chưa có liên kết — nhấn + để thêm</div>`;
  } else {
    g.links.forEach((l, li) => {
      body.appendChild(renderLink(l, g.id, li));
    });
  }

  // Drag events for group (desktop HTML5 DnD)
  if (editMode) {
    card.addEventListener('dragstart', e => {
      // Ignore if the drag originated from a link card inside this group
      if (e.target.closest && e.target.closest('.link-card')) return;
      dragSrcGroup = g.id;
      dragSrcLink = null;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 10);
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('dragover', e => {
      e.preventDefault();
      if (dragSrcGroup && dragSrcGroup !== g.id && !dragSrcLink) {
        card.classList.add('drag-over');
      }
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (dragSrcGroup && dragSrcGroup !== g.id && !dragSrcLink) {
        const fromIdx = state.groups.findIndex(x => x.id === dragSrcGroup);
        const toIdx = state.groups.findIndex(x => x.id === g.id);
        if (fromIdx > -1 && toIdx > -1) {
          const [moved] = state.groups.splice(fromIdx, 1);
          state.groups.splice(toIdx, 0, moved);
          save(); render();
        }
      }
    });

    // Touch drag for group (mobile/iOS) – attach to header to avoid conflict with link cards
    initTouchDrag(hdr, g.id, null);
  }

  card.appendChild(hdr);
  card.appendChild(body);
  return card;
}

function handleFaviconError(img) {
  img.parentNode.innerHTML = '<div class="link-favicon">🔗</div>';
}

function renderLink(l, gid, li) {
  const card = document.createElement('div');
  card.className = 'link-card';
  card.dataset.lid = l.id;
  card.draggable = true; // always draggable

  // Image
  let imgHTML = '';
  if (l.img) {
    imgHTML = `<div class="link-img-wrap"><img src="${esc(l.img)}" alt="" onerror="handleFaviconError(this)"></div>`;
  } else {
    const domain = (() => { try { return new URL(l.url).hostname; } catch(e) { return ''; } })();
    if (domain) {
      imgHTML = `<div class="link-img-wrap"><img src="https://www.google.com/s2/favicons?sz=64&domain=${domain}" alt="" onerror="handleFaviconError(this)"></div>`;
    } else {
      imgHTML = `<div class="link-img-wrap"><div class="link-favicon">🔗</div></div>`;
    }
  }

  card.innerHTML = `
    ${imgHTML}
    <div class="link-name">${esc(l.name||l.url)}</div>
    <div class="link-url">${esc(getHostname(l.url))}</div>
    <div class="link-actions">
      <button class="btn btn-ghost btn-icon" title="Sửa" onclick="event.stopPropagation();openEditLink('${gid}','${l.id}')">✎</button>
      <button class="btn btn-icon" style="background:transparent;border:1px solid var(--danger);color:var(--danger2);" title="Xóa" onclick="event.stopPropagation();deleteLink('${gid}','${l.id}')">✕</button>
    </div>
  `;

  // Click to open (non-edit mode)
  card.addEventListener('click', () => {
    if (card._wasDragging) { card._wasDragging = false; return; }
    if (!editMode) window.open(l.url, '_blank', 'noopener');
  });

  // HTML5 Drag events for link (desktop)
  card.addEventListener('dragstart', e => {
    if (!editMode) return;
    dragSrcGroup = gid;
    dragSrcLink = l.id;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => card.classList.add('dragging-link'), 10);
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging-link'));
  card.addEventListener('dragover', e => {
    e.preventDefault();
    if (dragSrcLink && editMode) card.classList.add('drag-over-link');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over-link'));
  card.addEventListener('drop', e => {
    e.preventDefault();
    card.classList.remove('drag-over-link');
    if (!dragSrcLink || !editMode) return;
    const srcGroup = state.groups.find(x => x.id === dragSrcGroup);
    const dstGroup = state.groups.find(x => x.id === gid);
    if (!srcGroup || !dstGroup) return;
    const srcIdx = srcGroup.links.findIndex(x => x.id === dragSrcLink);
    const dstIdx = dstGroup.links.findIndex(x => x.id === l.id);
    if (srcIdx === -1) return;
    const [moved] = srcGroup.links.splice(srcIdx, 1);
    if (srcGroup.id === dstGroup.id) {
      dstGroup.links.splice(dstIdx, 0, moved);
    } else {
      dstGroup.links.splice(dstIdx >= 0 ? dstIdx : dstGroup.links.length, 0, moved);
    }
    save(); render();
  });

  // Touch drag for link (mobile/iOS)
  initTouchDrag(card, gid, l.id);

  return card;
}

// ===== TOUCH DRAG & DROP (iOS/Mobile) =====
function initTouchDrag(card, gid, lid) {
  let pressTimer = null;
  let isDragging = false;
  let clone = null;
  let startX = 0, startY = 0;

  function cleanup() {
    clearTimeout(pressTimer);
    pressTimer = null;
    if (clone) { clone.remove(); clone = null; }
    card.style.opacity = '';
    isDragging = false;
    document.querySelectorAll('.drag-over, .drag-over-link').forEach(x => {
      x.classList.remove('drag-over', 'drag-over-link');
    });
  }

  card.addEventListener('touchstart', e => {
    if (!editMode) return;
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;

    pressTimer = setTimeout(() => {
      isDragging = true;
      const rect = card.getBoundingClientRect();
      clone = card.cloneNode(true);
      clone.style.cssText = `
        position:fixed;width:${rect.width}px;height:${rect.height}px;
        top:${rect.top}px;left:${rect.left}px;
        opacity:0.85;pointer-events:none;z-index:9999;
        border:2px solid var(--accent);border-radius:var(--radius-sm);
        transform:scale(1.05) rotate(2deg);transition:none;
        box-shadow:0 8px 32px rgba(0,0,0,0.5);
      `;
      document.body.appendChild(clone);
      card.style.opacity = '0.3';
      if (lid) { dragSrcGroup = gid; dragSrcLink = lid; }
      else { dragSrcGroup = gid; dragSrcLink = null; }
    }, 350);
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    const touch = e.touches[0];
    const dx = Math.abs(touch.clientX - startX);
    const dy = Math.abs(touch.clientY - startY);

    if (!isDragging) {
      // Cancel press if user is scrolling
      if (dx > 8 || dy > 8) clearTimeout(pressTimer);
      return;
    }

    e.preventDefault();
    const rect = card.getBoundingClientRect();
    const cw = clone ? parseInt(clone.style.width) : rect.width;
    const ch = clone ? parseInt(clone.style.height) : rect.height;
    if (clone) {
      clone.style.top  = (touch.clientY - ch / 2) + 'px';
      clone.style.left = (touch.clientX - cw / 2) + 'px';
    }

    // Clear previous highlights
    document.querySelectorAll('.drag-over, .drag-over-link').forEach(x => {
      x.classList.remove('drag-over', 'drag-over-link');
    });

    // Find element under finger
    if (clone) clone.style.display = 'none';
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if (clone) clone.style.display = '';

    if (!el) return;
    if (lid) {
      const tLink = el.closest('.link-card');
      if (tLink && tLink !== card) tLink.classList.add('drag-over-link');
    } else {
      const tGroup = el.closest('.group-card');
      if (tGroup && tGroup.dataset.gid !== gid) tGroup.classList.add('drag-over');
    }
  }, { passive: false });

  function onTouchEnd(e) {
    if (!isDragging) { cleanup(); return; }
    card._wasDragging = true; // prevent click-after-touch from firing

    const touch = e.changedTouches[0];
    if (clone) clone.style.display = 'none';
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    cleanup();

    if (!el) return;

    if (lid) {
      // Drop link onto another link card
      const tLink = el.closest('.link-card');
      if (!tLink || tLink === card) return;
      const dstLid = tLink.dataset.lid;
      const dstGid = tLink.closest('.group-card')?.dataset.gid;
      if (!dstLid || !dstGid) return;
      const srcGroup = state.groups.find(x => x.id === dragSrcGroup);
      const dstGroup = state.groups.find(x => x.id === dstGid);
      if (!srcGroup || !dstGroup) return;
      const srcIdx = srcGroup.links.findIndex(x => x.id === dragSrcLink);
      const dstIdx = dstGroup.links.findIndex(x => x.id === dstLid);
      if (srcIdx === -1) return;
      const [moved] = srcGroup.links.splice(srcIdx, 1);
      dstGroup.links.splice(dstIdx >= 0 ? dstIdx : dstGroup.links.length, 0, moved);
      save(); render();
    } else {
      // Drop group onto another group
      const tGroup = el.closest('.group-card');
      if (!tGroup || tGroup.dataset.gid === gid) return;
      const fromIdx = state.groups.findIndex(x => x.id === gid);
      const toIdx = state.groups.findIndex(x => x.id === tGroup.dataset.gid);
      if (fromIdx > -1 && toIdx > -1) {
        const [moved] = state.groups.splice(fromIdx, 1);
        state.groups.splice(toIdx, 0, moved);
        save(); render();
      }
    }

    dragSrcGroup = null; dragSrcLink = null;
  }

  card.addEventListener('touchend', onTouchEnd);
  card.addEventListener('touchcancel', cleanup);
}

// ===== TOGGLE GROUP =====
function toggleGroup(gid) {
  if (state.collapsedGroups[gid]) {
    delete state.collapsedGroups[gid];
  } else {
    state.collapsedGroups[gid] = true;
  }
  save();
  const card = document.querySelector(`.group-card[data-gid="${gid}"]`);
  if (card) {
    if (state.collapsedGroups[gid]) card.classList.add('collapsed');
    else card.classList.remove('collapsed');
  }
}

// ===== COLLAPSE ALL =====
document.getElementById('btn-collapse-all').addEventListener('click', () => {
  const anyOpen = state.groups.some(g => !state.collapsedGroups[g.id]);
  if (anyOpen) {
    state.groups.forEach(g => { state.collapsedGroups[g.id] = true; });
    showToast('Đã thu gọn tất cả');
  } else {
    state.collapsedGroups = {};
    showToast('Đã mở rộng tất cả');
  }
  save(); render();
});

// ===== EDIT MODE =====
function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('btn-edit-mode');
  if (editMode) {
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> <span>Xong</span>`;
    btn.classList.add('btn-primary');
    btn.classList.remove('btn-ghost');
  } else {
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> <span>Sửa</span>`;
    btn.classList.remove('btn-primary');
    btn.classList.add('btn-ghost');
  }
  render();
}
document.getElementById('btn-edit-mode').addEventListener('click', toggleEditMode);


// ===== COLOR GRID =====
function buildColorGrid(selected) {
  const grid = document.getElementById('color-grid');
  grid.innerHTML = '';
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'color-dot' + (c === selected ? ' selected' : '');
    d.style.background = c;
    d.style.boxShadow = `0 2px 8px ${c}66`;
    d.addEventListener('click', () => {
      grid.querySelectorAll('.color-dot').forEach(x => x.classList.remove('selected'));
      d.classList.add('selected');
    });
    grid.appendChild(d);
  });
}
function getSelectedColor() {
  const sel = document.querySelector('.color-dot.selected');
  return sel ? sel.style.background : COLORS[0];
}

// ===== ADD GROUP =====
document.getElementById('add-group-area').addEventListener('click', () => {
  currentModalData = { mode: 'add' };
  document.getElementById('modal-group-title').textContent = 'Thêm nhóm mới';
  document.getElementById('group-name-input').value = '';
  buildColorGrid(COLORS[0]);
  openModal('modal-group');
});

// ===== EDIT GROUP =====
function openEditGroup(gid) {
  const g = state.groups.find(x => x.id === gid);
  if (!g) return;
  currentModalData = { mode: 'edit', gid };
  document.getElementById('modal-group-title').textContent = 'Sửa nhóm';
  document.getElementById('group-name-input').value = g.name;
  buildColorGrid(g.color || COLORS[0]);
  openModal('modal-group');
}

// Save group
document.getElementById('modal-group-save').addEventListener('click', () => {
  const name = document.getElementById('group-name-input').value.trim();
  if (!name) { shakeInput('group-name-input'); return; }
  const color = getSelectedColor();
  if (currentModalData.mode === 'add') {
    state.groups.push({ id: uid(), name, color, links: [] });
    showToast('✅ Đã thêm nhóm');
  } else {
    const g = state.groups.find(x => x.id === currentModalData.gid);
    if (g) { g.name = name; g.color = color; }
    showToast('✅ Đã cập nhật nhóm');
  }
  save(); render();
  closeModal('modal-group');
});
document.getElementById('modal-group-cancel').addEventListener('click', () => closeModal('modal-group'));

// ===== DELETE GROUP =====
function deleteGroup(gid) {
  const g = state.groups.find(x => x.id === gid);
  pendingDelete = { type: 'group', gid };
  document.getElementById('confirm-msg').textContent = `Xóa nhóm "${g?.name || 'này'}" và tất cả ${g?.links?.length || 0} liên kết bên trong?`;
  openModal('modal-confirm');
}

// ===== ADD LINK =====
function openAddLink(gid) {
  currentModalData = { mode: 'add', gid };
  document.getElementById('modal-link-title').textContent = 'Thêm liên kết';
  document.getElementById('link-url').value = '';
  document.getElementById('link-name').value = '';
  document.getElementById('link-img').value = '';
  document.getElementById('fetch-status').textContent = '';
  document.getElementById('img-preview-box').classList.remove('has-img');
  openModal('modal-link');
}

// ===== EDIT LINK =====
function openEditLink(gid, lid) {
  const g = state.groups.find(x => x.id === gid);
  const l = g?.links.find(x => x.id === lid);
  if (!l) return;
  currentModalData = { mode: 'edit', gid, lid };
  document.getElementById('modal-link-title').textContent = 'Sửa liên kết';
  document.getElementById('link-url').value = l.url;
  document.getElementById('link-name').value = l.name;
  document.getElementById('link-img').value = l.img || '';
  document.getElementById('fetch-status').textContent = '';
  if (l.img) {
    document.getElementById('img-preview-img').src = l.img;
    document.getElementById('img-preview-box').classList.add('has-img');
  } else {
    document.getElementById('img-preview-box').classList.remove('has-img');
  }
  openModal('modal-link');
}

// Auto-preview image
document.getElementById('link-img').addEventListener('input', function() {
  const val = this.value.trim();
  const preview = document.getElementById('img-preview-box');
  const img = document.getElementById('img-preview-img');
  if (val) {
    img.src = val;
    preview.classList.add('has-img');
    img.onerror = () => preview.classList.remove('has-img');
  } else {
    preview.classList.remove('has-img');
  }
});

// Fetch title
document.getElementById('fetch-title-btn').addEventListener('click', async () => {
  const url = document.getElementById('link-url').value.trim();
  if (!url) return;
  const status = document.getElementById('fetch-status');
  status.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span> Đang lấy tiêu đề...';
  try {
    // Try multiple CORS proxies
    let title = null;
    const proxies = [
      `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    ];
    for (const proxy of proxies) {
      try {
        const r = await fetch(proxy, { signal: AbortSignal.timeout(8000) });
        const data = await r.json();
        const html = data.contents || '';
        const m = html.match(/<title[^>]*>([^<]{1,200})<\/title>/i);
        if (m) { title = m[1].trim().replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#39;/g,"'").replace(/&quot;/g,'"'); break; }
      } catch(e) {}
    }
    if (title) {
      document.getElementById('link-name').value = title;
      status.innerHTML = `<span style="color:var(--success)">✓ Đã lấy: ${esc(title.substring(0,60))}</span>`;
    } else {
      // Fallback: use hostname
      const hostname = getHostname(url);
      document.getElementById('link-name').value = hostname;
      status.innerHTML = `<span style="color:var(--text3)">Dùng tên miền: ${esc(hostname)}</span>`;
    }
  } catch(e) {
    status.innerHTML = `<span style="color:var(--danger2)">Không thể lấy tiêu đề</span>`;
  }
});

// Auto-fetch on URL blur
document.getElementById('link-url').addEventListener('blur', () => {
  const url = document.getElementById('link-url').value.trim();
  const name = document.getElementById('link-name').value.trim();
  if (url && !name) {
    document.getElementById('fetch-title-btn').click();
  }
});

// Save link
document.getElementById('modal-link-save').addEventListener('click', () => {
  const url = document.getElementById('link-url').value.trim();
  const name = document.getElementById('link-name').value.trim();
  const img = document.getElementById('link-img').value.trim();
  if (!url) { shakeInput('link-url'); return; }
  if (!name) { shakeInput('link-name'); return; }
  const gid = currentModalData.gid;
  const g = state.groups.find(x => x.id === gid);
  if (!g) return;
  if (currentModalData.mode === 'add') {
    g.links.push({ id: uid(), url, name, img });
    showToast('✅ Đã thêm liên kết');
  } else {
    const l = g.links.find(x => x.id === currentModalData.lid);
    if (l) { l.url = url; l.name = name; l.img = img; }
    showToast('✅ Đã cập nhật liên kết');
  }
  save(); render();
  closeModal('modal-link');
});
document.getElementById('modal-link-cancel').addEventListener('click', () => closeModal('modal-link'));

// ===== DELETE LINK =====
function deleteLink(gid, lid) {
  const g = state.groups.find(x => x.id === gid);
  const l = g?.links.find(x => x.id === lid);
  pendingDelete = { type: 'link', gid, lid };
  document.getElementById('confirm-msg').textContent = `Xóa liên kết "${l?.name || 'này'}"?`;
  openModal('modal-confirm');
}

document.getElementById('confirm-ok').addEventListener('click', () => {
  if (!pendingDelete) return;
  if (pendingDelete.type === 'group') {
    state.groups = state.groups.filter(x => x.id !== pendingDelete.gid);
    delete state.collapsedGroups[pendingDelete.gid];
    showToast('🗑️ Đã xóa nhóm');
  } else if (pendingDelete.type === 'link') {
    const g = state.groups.find(x => x.id === pendingDelete.gid);
    if (g) g.links = g.links.filter(x => x.id !== pendingDelete.lid);
    showToast('🗑️ Đã xóa liên kết');
  }
  save(); render();
  closeModal('modal-confirm');
  pendingDelete = null;
});
document.getElementById('confirm-cancel').addEventListener('click', () => {
  closeModal('modal-confirm');
  pendingDelete = null;
});

// ===== MODAL HELPERS =====
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
// Click outside to close
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ===== UTILS =====
function uid() { return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getHostname(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch(e) { return url; }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== BACKUP: EXPORT JSON =====
document.getElementById('btn-export-json').addEventListener('click', () => {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `linkvault-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast('✅ Đã xuất file JSON');
});

// ===== BACKUP: IMPORT JSON =====
document.getElementById('import-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (imported && Array.isArray(imported.groups)) {
        state = imported;
        if (!state.collapsedGroups) state.collapsedGroups = {};
        if (!state.theme) state.theme = '';
        save();
        render();
        showToast('✅ Đã nhập dữ liệu thành công');
      } else {
        showToast('❌ File JSON không đúng định dạng');
      }
    } catch(err) {
      showToast('❌ Lỗi đọc file JSON');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ===== BACKUP: EXPORT HTML =====
document.getElementById('btn-export-html').addEventListener('click', () => {
  const stateData = JSON.stringify(state).replace(/<\/script>/gi, '<\\/script>');
  let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  // Inject current state so exported file works standalone
  const initReplace = html.replace(
    /\/\/ ===== INIT =====\s*\nload\(\);/,
    `// ===== INIT (BACKUP ${new Date().toISOString().slice(0,10)}) =====\nstate = ${stateData};\nif (!state.groups) state.groups = [];\nif (!state.collapsedGroups) state.collapsedGroups = {};\nif (!state.theme) state.theme = '';`
  );
  // Remove the "add sample data if empty" block so it doesn't overwrite
  const finalHtml = initReplace.replace(
    /\/\/ Add sample data if empty[\s\S]*?save\(\); render\(\);\s*\}/,
    '// (sample data removed – loaded from backup)'
  );
  const blob = new Blob([finalHtml], { type: 'text/html; charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `linkvault-${new Date().toISOString().slice(0,10)}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast('✅ Đã xuất file HTML');
});
function shakeInput(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--danger)';
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = 'shake 0.3s ease';
  setTimeout(() => { el.style.borderColor = ''; el.style.animation = ''; }, 700);
}

// ===== HAMBURGER MENU =====
// Close menu when clicking outside
document.addEventListener('click', (e) => {
  const menuDropdown = document.getElementById('menu-dropdown');
  const menuToggle = document.getElementById('btn-menu-toggle');
  if (!e.target.closest('#btn-menu-toggle') && !e.target.closest('.menu-dropdown')) {
    menuDropdown.classList.remove('show');
  }
});

// ===== SAMPLE DATA: LOAD FROM data/ FOLDER =====
const sampleDataDropdownInMenu = document.getElementById('sample-data-dropdown-in-menu');
let sampleDataCache = {};

async function loadSampleDataListInMenu() {
  sampleDataDropdownInMenu.innerHTML = '<div class="sample-data-dropdown-item loading"><span class="loading-dots"><span></span><span></span><span></span></span> Đang tải...</div>';
  
  try {
    const indexResponse = await fetch('./data/index.json');
    if (indexResponse.ok) {
      const fileList = await indexResponse.json();
      displaySampleDataFilesInMenu(fileList);
    } else {
      tryCommonSampleFilesInMenu();
    }
  } catch (err) {
    console.error('Error loading sample data list:', err);
    sampleDataDropdownInMenu.innerHTML = '<div class="sample-data-dropdown-empty">❌ Không thể tải danh sách dữ liệu</div>';
  }
}

async function tryCommonSampleFilesInMenu() {
  const commonFiles = ['samples.json', 'data.json', 'links.json', 'backup.json'];
  const availableFiles = [];
  
  for (const filename of commonFiles) {
    try {
      const response = await fetch(`./data/${filename}`);
      if (response.ok) {
        availableFiles.push(filename);
      }
    } catch (err) {}
  }
  
  if (availableFiles.length > 0) {
    displaySampleDataFilesInMenu(availableFiles);
  } else {
    sampleDataDropdownInMenu.innerHTML = '<div class="sample-data-dropdown-empty">📁 Không tìm thấy file dữ liệu</div>';
  }
}

function displaySampleDataFilesInMenu(files) {
  if (!files || files.length === 0) {
    sampleDataDropdownInMenu.innerHTML = '<div class="sample-data-dropdown-empty">📁 Không có file dữ liệu</div>';
    return;
  }
  
  sampleDataDropdownInMenu.innerHTML = '';
  files.forEach(filename => {
    const item = document.createElement('div');
    item.className = 'sample-data-dropdown-item';
    item.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg> ${esc(filename)}`;
    item.addEventListener('click', () => loadSampleDataFileInMenu(filename));
    sampleDataDropdownInMenu.appendChild(item);
  });
}

async function loadSampleDataFileInMenu(filename) {
  sampleDataDropdownInMenu.classList.remove('show');
  document.getElementById('menu-dropdown').classList.remove('show');
  
  try {
    const response = await fetch(`./data/${filename}`);
    if (!response.ok) throw new Error('File not found');
    const data = await response.json();
    
    if (data && Array.isArray(data.groups)) {
      state = data;
      if (!state.collapsedGroups) state.collapsedGroups = {};
      if (!state.theme) state.theme = '';
      save();
      render();
      showToast(`✅ Đã tải dữ liệu từ ${filename}`);
    } else {
      showToast('❌ Định dạng file không hợp lệ');
    }
  } catch (err) {
    console.error('Error loading sample data:', err);
    showToast(`❌ Lỗi tải dữ liệu từ ${filename}`);
  }
}
